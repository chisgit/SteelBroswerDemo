# Steel CAPTCHA Gauntlet — Netlify config
# Static UI in public/, serverless agent in netlify/functions/.

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  # Functions are ESM (.mjs); bundle with esbuild on node 22.
  node_bundler = "esbuild"
  # playwright-core lazy-requires these; mark external so esbuild doesn't choke at
  # bundle time (they're resolved at runtime from node_modules).
  external_node_modules = ["playwright-core", "chromium-bidi"]

# Friendly function path: /api/* -> /.netlify/functions/*
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA-ish fallback for the control UI (gauntlet routes are real files, served first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
